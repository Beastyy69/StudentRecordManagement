# =====================================================================
#  Student Record Management System - configuration
# =====================================================================

# Storage mode:
#   auto = use the database if the JDBC driver jar is in lib/, otherwise a file  (default)
#   jdbc = database only
#   file = file only (no database or driver needed)
storage.type=auto

# ---------- SQLite (default, zero setup) ----------
db.driver=org.sqlite.JDBC
db.url=jdbc:sqlite:data/students.db
db.user=
db.password=

# ---------- MySQL (uncomment these and comment out the SQLite lines) ----------
# Run sql/mysql_schema.sql first, and put mysql-connector-j-x.x.x.jar in lib/
#db.driver=com.mysql.cj.jdbc.Driver
#db.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC
#db.user=root
#db.password=your_mysql_password

# ---------- File storage (used when storage.type=file or as fallback) ----------
file.path=data/students.dat

# ---------- Admin login ----------
# Default: admin / admin123
# To change the password, generate a new hash with:
#   java -cp out com.srms.util.PasswordUtil NewPassword
admin.username=admin
admin.passwordHash=240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9
